<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Enterprise Revenue Estimator{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('home') }}">Revenue Estimator</a>
        <nav aria-label="Main navigation">
            <a href="{{ url_for('home') }}">Overview</a>
            <a href="{{ url_for('predict') }}">Predict</a>
        </nav>
    </header>
    <main class="page">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        Estimates are for informational purposes and are not financial advice.
    </footer>
</body>
</html>
